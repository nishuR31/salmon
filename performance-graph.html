<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salmon Performance Dashboard</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: rgba(22, 30, 49, 0.75);
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-map: #38bdf8;
        --accent-salmon: #fb7185;
        --salmon-grad: linear-gradient(135deg, #f43f5e, #fda4af);
        --track-bg: rgba(255, 255, 255, 0.06);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        padding: 2.5rem 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2.5rem;
        border-bottom: 1px solid var(--card-border);
        padding-bottom: 1.5rem;
      }

      .badge-bar {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(244, 63, 94, 0.12);
        border: 1px solid rgba(244, 63, 94, 0.3);
        color: #fb7185;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
      }

      h1 {
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(to right, #ffffff, #cbd5e1);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
      }

      .meta-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .meta-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .tag {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--card-border);
        padding: 0.3rem 0.8rem;
        border-radius: 8px;
        font-size: 0.85rem;
        color: #cbd5e1;
      }

      .tag strong {
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(540px, 1fr));
        gap: 1.5rem;
      }

      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 1.75rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        transition:
          transform 0.2s ease,
          border-color 0.2s ease;
      }

      .card:hover {
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 700;
        text-transform: capitalize;
        margin-bottom: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .workload-type {
        font-size: 0.75rem;
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-muted);
        font-weight: 500;
        text-transform: uppercase;
      }

      .benchmark-entry {
        margin-bottom: 1.25rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .benchmark-entry:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .structure-label {
        width: 75px;
        font-weight: 700;
        font-size: 0.95rem;
      }

      .structure-label.Map {
        color: var(--accent-map);
      }
      .structure-label.Salmon {
        color: var(--accent-salmon);
      }

      .track {
        flex: 1;
        height: 22px;
        background: var(--track-bg);
        border-radius: 9999px;
        overflow: hidden;
        padding: 2px;
      }

      .fill {
        height: 100%;
        border-radius: 9999px;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .fill.Map {
        background: linear-gradient(90deg, #0284c7, #38bdf8);
      }
      .fill.Salmon {
        background: var(--salmon-grad);
        box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
      }

      .value-label {
        width: 140px;
        text-align: right;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
      }

      .stats-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.8rem;
        margin-top: 0.5rem;
      }

      .stat-chip {
        background: rgba(255, 255, 255, 0.04);
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        color: #94a3b8;
      }

      .stat-chip strong {
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="badge-bar">Performance Telemetry</div>
      <h1>Salmon vs Map Benchmark</h1>
      <p class="meta-subtitle">
        Empirical validation under real-world access distributions.
      </p>
      <div class="meta-tags" id="meta-tags">
        <span class="tag">Loading benchmark metadata...</span>
      </div>
    </header>

    <main id="app" class="grid">
      <div class="card">
        <p style="color: var(--text-muted)">Loading metrics...</p>
      </div>
    </main>

    <script>
      const FALLBACK_DATA = {
        metadata: {
          project: "salmon",
          runtime: "Bun 1.4.3",
          date: "2026-10-11T21:01:23.002Z",
          datasetSize: 50000,
          operations: 300000,
          warmup: 20000,
          timingSampleEvery: 20,
          note: "Measures lookup + Salmon adaptation. Plain Map provides expected O(1) without telemetry overhead.",
        },
        benchmarks: [
          {
            workload: "uniform",
            structure: "Map",
            operations: 300000,
            elapsedMs: 37.4,
            opsPerSecond: 8017189,
            averageNs: 124.7,
            p50Ns: 38,
            p95Ns: 78,
            p99Ns: 96,
            hits: 0,
            misses: 0,
            promotions: 0,
            demotions: 0,
            reorders: 0,
            comparisons: 0,
          },
          {
            workload: "uniform",
            structure: "Salmon",
            operations: 300000,
            elapsedMs: 315.2,
            opsPerSecond: 951905,
            averageNs: 1050.5,
            p50Ns: 520,
            p95Ns: 1717,
            p99Ns: 5967,
            hits: 300000,
            misses: 0,
            promotions: 44541,
            demotions: 0,
            reorders: 1523191,
            comparisons: 1778572,
          },
          {
            workload: "hotspot",
            structure: "Map",
            operations: 300000,
            elapsedMs: 37.6,
            opsPerSecond: 7968796,
            averageNs: 125.5,
            p50Ns: 42,
            p95Ns: 81,
            p99Ns: 110,
            hits: 0,
            misses: 0,
            promotions: 0,
            demotions: 0,
            reorders: 0,
            comparisons: 0,
          },
          {
            workload: "hotspot",
            structure: "Salmon",
            operations: 300000,
            elapsedMs: 227.0,
            opsPerSecond: 1321556,
            averageNs: 756.7,
            p50Ns: 381,
            p95Ns: 1305,
            p99Ns: 6381,
            hits: 300000,
            misses: 0,
            promotions: 8134,
            demotions: 0,
            reorders: 1826831,
            comparisons: 2118411,
          },
          {
            workload: "zipf",
            structure: "Map",
            operations: 300000,
            elapsedMs: 54.1,
            opsPerSecond: 5543803,
            averageNs: 180.4,
            p50Ns: 43,
            p95Ns: 85,
            p99Ns: 114,
            hits: 0,
            misses: 0,
            promotions: 0,
            demotions: 0,
            reorders: 0,
            comparisons: 0,
          },
          {
            workload: "zipf",
            structure: "Salmon",
            operations: 300000,
            elapsedMs: 311.4,
            opsPerSecond: 963453,
            averageNs: 1037.9,
            p50Ns: 502,
            p95Ns: 1729,
            p99Ns: 6811,
            hits: 300000,
            misses: 0,
            promotions: 44467,
            demotions: 0,
            reorders: 1594331,
            comparisons: 1849763,
          },
          {
            workload: "phase-shift",
            structure: "Map",
            operations: 300000,
            elapsedMs: 66.3,
            opsPerSecond: 4524890,
            averageNs: 221.0,
            p50Ns: 64,
            p95Ns: 112,
            p99Ns: 130,
            hits: 0,
            misses: 0,
            promotions: 0,
            demotions: 0,
            reorders: 0,
            comparisons: 0,
          },
          {
            workload: "phase-shift",
            structure: "Salmon",
            operations: 300000,
            elapsedMs: 432.6,
            opsPerSecond: 693510,
            averageNs: 1441.9,
            p50Ns: 566,
            p95Ns: 2098,
            p99Ns: 8132,
            hits: 300000,
            misses: 0,
            promotions: 22594,
            demotions: 0,
            reorders: 1873176,
            comparisons: 2150161,
          },
        ],
      };

      async function render() {
        let data;
        try {
          const res = await fetch("performance.json");
          data = await res.json();
        } catch (err) {
          data = FALLBACK_DATA;
        }

        const metaContainer = document.getElementById("meta-tags");
        metaContainer.innerHTML = `
    <span class="tag">Runtime: <strong>${data.metadata.runtime}</strong></span>
    <span class="tag">Dataset Keys (N): <strong>${data.metadata.datasetSize.toLocaleString()}</strong></span>
    <span class="tag">Ops Per Workload: <strong>${data.metadata.operations.toLocaleString()}</strong></span>
    <span class="tag">Warmup: <strong>${data.metadata.warmup.toLocaleString()}</strong></span>
  `;

        const byWorkload = new Map();
        for (const row of data.benchmarks) {
          if (!byWorkload.has(row.workload)) byWorkload.set(row.workload, []);
          byWorkload.get(row.workload).push(row);
        }

        const fmt = (n) =>
          Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
        const app = document.getElementById("app");
        const cardsHtml = [];

        for (const [workload, rows] of byWorkload) {
          const maxOps = Math.max(...rows.map((r) => r.opsPerSecond), 1);
          const descriptions = {
            uniform: "Keys selected uniformly at random; minimal locality.",
            hotspot: "5% of keys receive ~80% of accesses; high locality.",
            zipf: "Long-tail power distribution (rank power 1.15).",
            "phase-shift":
              "Popular key region changes halfway through the run.",
          };

          cardsHtml.push(`
      <section class="card">
        <div class="card-title">
          <span>${workload}</span>
          <span class="workload-type">${descriptions[workload] || "Workload"}</span>
        </div>
        ${rows
          .map((r) => {
            const pct = Math.max(5, (r.opsPerSecond / maxOps) * 100);
            const isSalmon = r.structure === "Salmon";
            return `
            <div class="benchmark-entry">
              <div class="bar-row">
                <div class="structure-label ${r.structure}">${r.structure}</div>
                <div class="track">
                  <div class="fill ${r.structure}" style="width: ${pct.toFixed(1)}%"></div>
                </div>
                <div class="value-label">${fmt(r.opsPerSecond)} <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted)">ops/s</span></div>
              </div>
              <div class="stats-row">
                <span class="stat-chip">p50: <strong>${fmt(r.p50Ns)} ns</strong></span>
                <span class="stat-chip">p95: <strong>${fmt(r.p95Ns)} ns</strong></span>
                <span class="stat-chip">p99: <strong>${fmt(r.p99Ns)} ns</strong></span>
                ${
                  isSalmon ?
                    `
                  <span class="stat-chip">Promotions: <strong>${fmt(r.promotions)}</strong></span>
                  <span class="stat-chip">Swaps: <strong>${fmt(r.reorders)}</strong></span>
                  <span class="stat-chip">Comparisons: <strong>${fmt(r.comparisons)}</strong></span>
                `
                  : ""
                }
              </div>
            </div>
          `;
          })
          .join("")}
      </section>
    `);
        }

        app.innerHTML = cardsHtml.join("");
      }

      render();
    </script>
  </body>
</html>
